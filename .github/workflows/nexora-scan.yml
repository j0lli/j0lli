name: Nexora private-source scan

on:
  schedule:
    # UTC union of the Rome window. Local-time gate handles CET/CEST.
    - cron: "*/10 6-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: nexora-private-source-scan
  cancel-in-progress: false

jobs:
  scan:
    # Enable only after NEXORA_REPO_TOKEN is configured in this public repo.
    if: ${{ vars.NEXORA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QUANT_DATA_DIR: ${{ github.workspace }}/nexora/scanner/out/quant-data
      QUANT_CACHE_DIR: ${{ github.workspace }}/nexora/scanner/out/quant-cache
      QUANT_STATE_BRANCH: quant-scanner-data
      QUANT_SCAN_DEADLINE_SEC: "240"
      QUANT_WORKERS: "10"
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      DESK_NEWS_RSS_URLS: ${{ vars.DESK_NEWS_RSS_URLS }}
      QUANT_HEAD_WEBHOOK_URL: ${{ secrets.QUANT_HEAD_WEBHOOK_URL }}
      QUANT_HEAD_WEBHOOK_KEY: ${{ secrets.QUANT_HEAD_WEBHOOK_KEY }}
    steps:
      - name: Check Europe/Rome desk window
        id: window
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Rome"))
          allowed = now.weekday() < 5 and 8 <= now.hour < 23
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"open={str(allowed).lower()}\n")
          print(f"Europe/Rome time: {now:%Y-%m-%d %H:%M:%S %Z}; scan window open={allowed}")
          PY

      - name: Checkout private scanner
        if: steps.window.outputs.open == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: j0lli/nexora
          ref: main
          token: ${{ secrets.NEXORA_REPO_TOKEN }}
          path: nexora
          persist-credentials: true

      - name: Install Python dependency
        if: steps.window.outputs.open == 'true'
        run: python3 -m pip install --disable-pip-version-check -r nexora/scanner/requirements.txt

      - name: Restore private scanner state
        if: steps.window.outputs.open == 'true'
        run: bash nexora/scanner/restore_quant_state.sh

      - name: Preserve previous delivery state
        if: steps.window.outputs.open == 'true'
        run: |
          source_file="nexora/scanner/out/quant-data/quant_scan_latest.json"
          if [[ -f "$source_file" ]]; then
            cp "$source_file" "$RUNNER_TEMP/nexora_previous_scan.json"
          fi

      - name: Run one read-only scan
        id: quant_scan
        if: steps.window.outputs.open == 'true'
        continue-on-error: true
        run: python3 nexora/scanner/quant_scanner.py

      - name: Deliver quality-gated Head handoff
        if: always() && steps.window.outputs.open == 'true' && steps.quant_scan.outcome == 'success' && hashFiles('nexora/scanner/out/quant-data/quant_desk_handoff.json') != ''
        env:
          WEBHOOK_URL: ${{ secrets.QUANT_HEAD_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.QUANT_HEAD_WEBHOOK_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          data_dir = Path(os.environ["QUANT_DATA_DIR"])
          handoff_path = data_dir / "quant_desk_handoff.json"
          latest_path = data_dir / "quant_scan_latest.json"
          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          previous_path = Path(os.environ["RUNNER_TEMP"]) / "nexora_previous_scan.json"
          try:
              previous = json.loads(previous_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              previous = {}
          delivery = previous.get("delivery", {}) if isinstance(previous, dict) else {}
          previous_delivery = delivery.get("head_webhook", {}) if isinstance(delivery, dict) else {}
          last_sent_fp = previous_delivery.get("last_sent_fingerprint")
          last_sent_at = previous_delivery.get("last_sent_at_unix")
          now = int(time.time())

          def persist(status, fingerprint=None, sent_at=None):
              state = {"status": status}
              if fingerprint:
                  state["last_sent_fingerprint"] = fingerprint
              if sent_at:
                  state["last_sent_at_unix"] = sent_at
              latest["delivery"] = {"head_webhook": state}
              latest_path.write_text(json.dumps(latest, separators=(",", ":")) + "\n", encoding="utf-8")

          url = os.environ.get("WEBHOOK_URL", "").strip()
          key = os.environ.get("WEBHOOK_KEY", "")
          if not url or not key:
              persist("disabled", last_sent_fp, last_sent_at)
              print("Head webhook disabled: URL or key is not configured.")
              raise SystemExit(0)

          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc or parsed.username or parsed.password:
              persist("invalid_configuration", last_sent_fp, last_sent_at)
              print("Head webhook configuration rejected: HTTPS URL required.")
              raise SystemExit(1)

          handoff = json.loads(handoff_path.read_text(encoding="utf-8"))
          if handoff.get("desk_state") not in {"candidate_review", "watch_only"}:
              persist("skipped_quality_gate", last_sent_fp, last_sent_at)
              print("Head handoff skipped: scanner quality gate is holding the data.")
              raise SystemExit(0)

          def signature_rows(rows, direction):
              result = []
              for row in rows if isinstance(rows, list) else []:
                  if not isinstance(row, dict):
                      continue
                  score = row.get("research_score")
                  score_band = int(float(score) // 5) if isinstance(score, (int, float)) else None
                  result.append({
                      "direction": direction,
                      "symbol": row.get("symbol"),
                      "contract": row.get("contract"),
                      "setup": row.get("primary_setup"),
                      "score_band": score_band,
                  })
              return result

          qualified = handoff.get("qualified_by_local_screen", {})
          watch = handoff.get("watch_only", {})
          signature = {
              "desk_state": handoff.get("desk_state"),
              "long": signature_rows(qualified.get("long"), "long") + signature_rows(watch.get("long"), "long"),
              "short": signature_rows(qualified.get("short"), "short") + signature_rows(watch.get("short"), "short"),
          }
          if not signature["long"] and not signature["short"]:
              persist("no_candidates", last_sent_fp, last_sent_at)
              print("Head handoff skipped: no ranked long or short candidates.")
              raise SystemExit(0)
          fingerprint = hashlib.sha256(
              json.dumps(signature, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          try:
              last_sent_at = int(last_sent_at) if last_sent_at is not None else None
          except (TypeError, ValueError):
              last_sent_at = None
          if fingerprint == last_sent_fp and last_sent_at and now - last_sent_at < 1800:
              persist("deduplicated", last_sent_fp, last_sent_at)
              print("Head handoff deduplicated: unchanged candidates were sent recently.")
              raise SystemExit(0)

          body = json.dumps(handoff, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              url, data=body, method="POST",
              headers={"Content-Type": "application/json", "Accept": "application/json",
                       "Authorization": f"Bearer {key}",
                       "User-Agent": "nexora-github-runner/1.0"},
          )
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for attempt in range(2):
              try:
                  with opener.open(request, timeout=10) as response:
                      if 200 <= response.status < 300:
                          persist("sent", fingerprint, now)
                          print("Head handoff delivered.")
                          raise SystemExit(0)
                      raise RuntimeError(f"HTTP status {response.status}")
              except urllib.error.HTTPError as error:
                  if error.code not in {429, 500, 502, 503, 504} or attempt:
                      persist("failed_http", last_sent_fp, last_sent_at)
                      print(f"Head handoff failed: HTTP {error.code}.")
                      raise SystemExit(1)
                  time.sleep(1)
              except Exception as error:
                  if attempt:
                      persist("failed_" + type(error).__name__, last_sent_fp, last_sent_at)
                      print(f"Head handoff failed: {type(error).__name__}.")
                      raise SystemExit(1)
                  time.sleep(1)
          PY

      - name: Publish scan state to private repository
        id: publish
        if: always() && steps.window.outputs.open == 'true' && hashFiles('nexora/scanner/out/quant-data/quant_heartbeat.json') != ''
        run: bash nexora/scanner/publish_quant_state.sh

      - name: Summarize scan
        if: always() && steps.window.outputs.open == 'true'
        env:
          SCAN_OUTCOME: ${{ steps.quant_scan.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["QUANT_DATA_DIR"]) / "quant_heartbeat.json"
          if path.exists():
              hb = json.loads(path.read_text(encoding="utf-8"))
              lines = [
                  "## Nexora market scan", "",
                  f"- Status: **{hb.get('status', 'unknown')}**",
                  f"- Desk state: **{hb.get('desk_state', 'unknown')}**",
                  f"- Market coverage: **{hb.get('coverage_pct', 'unknown')}%**",
                  f"- Runtime: **{hb.get('runtime_seconds', 'unknown')} s**",
                  f"- Scan: `{hb.get('timestamp_utc', 'unknown')}`",
                  "- Source and output state remain in private repository `j0lli/nexora`.",
              ]
          else:
              lines = ["## Nexora market scan", "", "- No heartbeat was produced."]
          if os.environ.get("SCAN_OUTCOME") != "success":
              lines.append("- Scanner process returned an error; inspect this run's logs.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Fail if scan or state publication failed
        if: always() && steps.window.outputs.open == 'true' && (steps.quant_scan.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: exit 1
